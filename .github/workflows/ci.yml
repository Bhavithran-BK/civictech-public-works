name: DigOnce Continuous Integration

on:
  push:
    branches: [main, "feat/**", "role-d/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test Suite (FastAPI + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Backend Tests
        env:
          PYTHONPATH: .
          TESTING: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://spjprbkebzbbtzpowwiw.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_dummy' }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || 'secret' }}
        run: |
          pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Packages
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
